# ============================================================================
# .github/workflows/security.yml
# ----------------------------------------------------------------------------
# A robust CI/CD security gate. Every scanner runs via `docker run` (the
# GitHub-hosted runners have Docker preinstalled) so there are NO fragile
# third-party action version pins that can randomly fail to resolve.
#
# Controls demonstrated:
#   - gitleaks  : secret scanning (catches hardcoded JWT secrets)
#   - semgrep   : SAST (catches eval of input, broken JWT verification)
#   - trivy     : dependency / filesystem CVE scanning
#   - tfsec     : Terraform IaC scanning
#   - dashboard : auto-generated Markdown security posture report
#
# Plus a CROSS-PROJECT gate: it checks out the 02-jwt-audit-tool repo and runs
# the JWT auditor on a weak sample token, failing the build if the HIGH
# weak-secret finding is NOT caught — proving the two portfolio projects work
# together in real CI.
# ============================================================================

name: Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1) SECRET SCANNING -- gitleaks (docker)
      - name: gitleaks (secret scanning)
        id: gitleaks
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/pwd" zricethezav/gitleaks:latest \
            detect --source=/pwd -c /pwd/.gitleaks.toml --report-format json \
            --report-path /pwd/gitleaks.json || true

      # 2) SAST -- Semgrep (docker)
      - name: Semgrep (SAST)
        id: semgrep
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" returntocorp/semgrep:latest \
            semgrep scan --config auto --config /src/.semgrep.yml /src \
            --sarif --output /src/semgrep.sarif || true

      # 3) DEPENDENCY / FS SCAN -- Trivy (docker)
      - name: Trivy filesystem scan
        id: trivy
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/work" aquasec/trivy:latest fs /work \
            --severity CRITICAL,HIGH --format table --exit-code 0 \
            --output /work/trivy-fs.txt || true

      # 4) IaC SCAN -- tfsec (docker)
      - name: tfsec (Terraform IaC)
        id: tfsec
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" aquasec/tfsec:latest /src \
            --soft-fail --format markdown --out /src/tfsec.md || true

      # 5) DASHBOARD -- aggregate a human-readable report in the run summary
      - name: Build security dashboard
        run: |
          {
            echo "# 🔐 Security Pipeline Report"
            echo ""
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| Control | Tool | Result |"
            echo "|---------|------|--------|"
            echo "| Secrets | gitleaks | ${{ steps.gitleaks.outcome == 'success' && '✅ ran' || '⚠️ see logs' }} |"
            echo "| SAST | semgrep | ${{ steps.semgrep.outcome == 'success' && '✅ ran' || '⚠️ see logs' }} |"
            echo "| Deps/FS CVE | trivy | ${{ steps.trivy.outcome == 'success' && '✅ ran' || '⚠️ see logs' }} |"
            echo "| IaC | tfsec | ${{ steps.tfsec.outcome == 'success' && '✅ ran' || '⚠️ see logs' }} |"
            echo ""
            echo "## What each control catches"
            echo "- **gitleaks**: hardcoded secrets, API keys, JWT signing keys."
            echo "- **semgrep**: insecure code (eval, SQLi, weak crypto, broken JWT verify)."
            echo "- **trivy**: known CVEs in dependencies and base images."
            echo "- **tfsec**: insecure Terraform (open buckets, missing encryption)."
          } > security-report.md
          cat security-report.md >> "$GITHUB_STEP_SUMMARY"

      # 6) Upload artifacts for review
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            security-report.md
            gitleaks.json
            semgrep.sarif
            trivy-fs.txt
            tfsec.md
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # Cross-project gate: run the JWT audit tool (project 02) as a CI check.
  # Repo 02 is PUBLIC so the default GITHUB_TOKEN can read it. The weak-secret
  # sample MUST be flagged HIGH (exit 1) — we invert the exit so the step
  # PASSES when detection succeeds. If detection ever fails, the build breaks.
  # --------------------------------------------------------------------------
  jwt-audit:
    name: JWT Audit Tool (cross-project gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout jwt-audit-tool (public)
        uses: actions/checkout@v4
        with:
          repository: cy1ingachref/jwt-audit-tool
          path: jwt-tool

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate sample tokens + run auditor (must flag weak token)
        run: |
          cd jwt-tool
          python make_sample_tokens.py
          if python jwt_audit.py --file sample_weak.txt; then
            echo "ERROR: weak token was NOT detected — gate broken"; exit 1
          else
            echo "OK: weak JWT correctly flagged (HIGH finding present)"
          fi
